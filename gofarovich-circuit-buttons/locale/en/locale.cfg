[entity-name]
gofarovich-bc-pulse=Pulse button combinator
gofarovich-bc-switch=Switch button combinator

[entity-description]
gofarovich-bc-pulse=Sends a circuit signal when clicked. Rotate (R) to access settings on the terminal side; rotate back to use the button.
gofarovich-bc-switch=A two-state switch for the circuit network. Rotate (R) to access settings on the terminal side; rotate back to use the button.

