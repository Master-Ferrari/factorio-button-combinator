[entity-name]
gofarovich-bc-pulse=Pulse button combinator
gofarovich-bc-switch=Switch button combinator

[entity-description]
gofarovich-bc-pulse=Sends a circuit signal when clicked. Rotate (R) to access settings on the terminal side; rotate back to use the button.
gofarovich-bc-switch=A two-state switch for the circuit network. Rotate (R) to access settings on the terminal side; rotate back to use the button.

[item-name]
gofarovich-bc-pulse=Pulse button combinator
gofarovich-bc-switch=Switch button combinator

[item-description]
gofarovich-bc-pulse=Sends a circuit signal when clicked. Rotate to access settings.
gofarovich-bc-switch=A two-state switch for the circuit network. Rotate to access settings.

[gofarovich-bc-gui]
back-signal=Feedback
back-signal-tt=Let the circuit network run the button.\n"On when" turns it on, "Off when" turns it off. While a condition holds, manual clicks are off. If both fire at once, it just freezes as-is.
enable-cond=On when
disable-cond=Off when
operand-toggle-tt=Toggle the right operand between a constant and a signal
pick-signal=Select a signal
pick-none=Clear (no signal)
or-const=Or set a constant
set-const=Set constant
add-description=Add description
edit-description=Edit description
save-description=Save description
insert-icon=Insert icon:
insert-icon-tt=Pick a signal to insert its icon into the text
description=Description
active-signal=Active signal
inactive-signal=Idle signal
duration=Pulse length (ticks)
duration-tt=A click emits the active signal for this many ticks, then auto-releases.\n1 = a single-tick pulse. 60 ticks = 1 second. Re-clicking restarts the pulse.
