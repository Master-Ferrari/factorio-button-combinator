[entity-description]
gofarovich-bc-pulse=Отправляет сигнал в логическую сеть по клику. Поверните (R) терминалом к себе, чтобы открыть настройки; поверните обратно, чтобы пользоваться кнопкой.
gofarovich-bc-switch=Двухпозиционный переключатель для логической сети. Поверните (R) терминалом к себе, чтобы открыть настройки; поверните обратно, чтобы пользоваться тумблером.

[item-name]
