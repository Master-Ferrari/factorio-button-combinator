back-signal-tt=Управление состоянием кнопки из логической сети.\nКнопка включается, когда выполнено условие включения, и выключается по условию выключения. Пока условие выполнено, ручные клики заблокированы. Если выполнены оба условия — кнопка заблокирована и состояние не меняется.
