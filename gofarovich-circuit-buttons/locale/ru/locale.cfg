[item-description]
gofarovich-bc-pulse=Отправляет сигнал в логическую сеть по клику. Поверните, чтобы открыть настройки.
gofarovich-bc-switch=Двухпозиционный переключатель для логической сети. Поверните, чтобы открыть настройки.

